<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>OES 风扇助手</title>
<style>
:root{font-family:system-ui,"Microsoft YaHei",sans-serif;color:#19352d;background:#f0f5f2;font-size:15px}*{box-sizing:border-box}body{margin:0}main{max-width:1000px;margin:0 auto;padding:32px 24px}header{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:28px}h1{font-size:29px;letter-spacing:-1px;margin:0 0 6px}h2{font-size:18px;margin:0 0 18px}p{line-height:1.7;margin:5px 0}.muted{color:#65786e;font-size:13px}.tag{border:1px solid #c3d8cc;background:#e5f1e9;padding:7px 13px;border-radius:30px;white-space:nowrap}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{background:white;border:1px solid #dfe8e1;border-radius:18px;padding:22px;margin-bottom:18px}.value{font-size:38px;font-weight:650;letter-spacing:-1px;margin:10px 0}.unit{font-size:18px;color:#6b8174}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}button{border:1px solid #d7e1da;background:#f7faf8;color:#23483a;border-radius:10px;padding:11px 18px;font:inherit;cursor:pointer}button:hover{background:#eaf4ee}button.active,button.primary{background:#236449;color:white;border-color:#236449}button:disabled{opacity:.5;cursor:wait}.split{display:grid;grid-template-columns:1.2fr 1fr;gap:20px}.settings{display:grid;grid-template-columns:1fr 1fr;gap:15px}label{display:block;font-size:13px;color:#5f7568}input{display:block;width:100%;border:1px solid #cedbd2;border-radius:8px;padding:10px;margin-top:7px;font:inherit;color:#19352d;background:#fafcfb}canvas{width:100%;height:190px;margin:10px 0}.notice{background:#e9f3ed;border-radius:10px;padding:12px 14px;color:#3e6351;font-size:13px;margin-top:18px}.warn{background:#fff1df;color:#8c5414}#message{min-height:24px;color:#ad512b;margin-top:12px}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#3c9a62;margin-right:6px}.events{max-height:165px;overflow:auto;font-size:13px;color:#5f7568}.events p{border-top:1px solid #edf1ed;padding-top:7px}footer{color:#778b7e;font-size:12px;text-align:center;padding:8px}@media(max-width:700px){main{padding:22px 14px}.grid{gap:9px}.card{padding:16px}.value{font-size:28px}.split{grid-template-columns:1fr}header{align-items:flex-start}.tag{font-size:12px}h1{font-size:24px}}
</style>
<main>
<header><div><h1>OES 风扇助手</h1><p class="muted">按温度散热，让设备安静运行</p></div><span class="tag" id="connection">正在连接设备…</span></header>
<div class="grid">
<section class="card"><label>CPU 温度</label><div class="value"><span id="cpu">—</span><span class="unit"> ℃</span></div><p class="muted">处理器温度</p></section>
<section class="card"><label>DDR 温度</label><div class="value"><span id="ddr">—</span><span class="unit"> ℃</span></div><p class="muted">与 CPU 共同参与温控</p></section>
<section class="card"><label>风扇控制输出</label><div class="value" id="fan">—</div><p class="muted">两档开关 · 无测速反馈</p></section>
</div>
<section class="card"><h2>运行模式</h2><div class="row"><button data-mode="auto">自动温控</button><button data-mode="on">保持开启</button><button data-mode="off">临时关闭 10 分钟</button></div><p id="reason" class="notice">正在读取运行状态…</p><p class="muted" id="offtimer"></p><p class="muted" id="disk">硬盘温度：正在检测</p></section>
<div class="split">
<section class="card"><h2>温度记录</h2><p class="muted">CPU <span style="color:#2d8061">━━</span>　DDR <span style="color:#d49c49">━━</span>　每分钟记录，保留最近 12 小时</p><canvas id="chart"></canvas><p class="muted">记录从本次应用启动开始，不写入硬盘。</p><div class="events" id="events"></div></section>
<section class="card"><h2>温控设置</h2><form id="settings"><div class="settings"><label>芯片开启温度 / ℃<input id="on_temp" type="number" min="30" max="60" required></label><label>芯片关闭温度 / ℃<input id="off_temp" type="number" min="25" max="55" required></label><label>硬盘开启温度 / ℃<input id="disk_on" type="number" min="35" max="50" required></label><label>硬盘关闭温度 / ℃<input id="disk_off" type="number" min="25" max="45" required></label><label>最短运行时间 / 秒<input id="min_on" type="number" min="10" max="300" required></label></div><p class="muted" style="margin:14px 0">CPU 与 DDR 取较高值；开启温度须比关闭温度至少高 3℃。</p><button class="primary" type="submit">保存温度设置</button></form></section>
</div>
<div class="notice">保护始终生效：芯片达到 65℃、硬盘达到 55℃或芯片传感器异常时强制开启风扇。停止或卸载应用后，恢复系统原有风扇控制。</div><p id="message" role="status"></p>
<footer id="device">OES 风扇助手 1.0.1</footer>
</main>
<script>
const base='/app/oes-fancontrol', $=id=>document.getElementById(id);let csrf='',initialized=false,busy=false,lastState=null;
function draw(history){const c=$('chart'),ratio=devicePixelRatio||1,w=c.clientWidth,h=190;c.width=w*ratio;c.height=h*ratio;const x=c.getContext('2d');x.scale(ratio,ratio);const left=28,right=w-12,top=15,bottom=165;const points=history.length?history:[];const vals=points.flatMap(p=>[p.cpu,p.ddr]).filter(v=>v!==null);const low=Math.min(30,...vals)-3,high=Math.max(60,...vals)+3;x.font='11px system-ui';for(let i=0;i<4;i++){const t=low+(high-low)*i/3,y=bottom-(t-low)/(high-low)*(bottom-top);x.strokeStyle='#e8eee9';x.beginPath();x.moveTo(left,y);x.lineTo(right,y);x.stroke();x.fillStyle='#839487';x.fillText(Math.round(t)+'°',0,y+3)}for(const [key,color]of [['cpu','#2d8061'],['ddr','#d49c49']]){x.strokeStyle=color;x.lineWidth=2;x.beginPath();let begun=false;points.forEach((p,i)=>{if(p[key]===null){begun=false;return}const px=left+i/Math.max(1,points.length-1)*(right-left),py=bottom-(p[key]-low)/(high-low)*(bottom-top);if(begun)x.lineTo(px,py);else{x.moveTo(px,py);begun=true}x.fillStyle=color;x.fillRect(px-1.5,py-1.5,3,3)});x.stroke()}if(points.length){x.fillStyle='#839487';x.fillText(new Date(points[0].time*1000).toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'}),left,185);x.fillText('现在',right-25,185)}}
function render(s){lastState=s;for(const k of ['cpu','ddr'])$(k).textContent=s[k]===null?'—':s[k].toFixed(1);$('fan').textContent=s.on?'开启':'关闭';$('connection').textContent='● 已连接';$('reason').textContent=s.reason;$('reason').classList.toggle('warn',s.emergency||s.reason.includes('异常'));$('offtimer').textContent=s.off_remaining?'剩余 '+Math.ceil(s.off_remaining/60)+' 分钟，之后自动恢复温控':'';$('disk').textContent=s.disks.length?'硬盘温度：'+s.disks.map(t=>t.toFixed(1)+'℃').join(' / '):'硬盘温度：未检测到温度接口，当前依据 CPU / DDR 温控';document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('active',b.dataset.mode===s.config.mode));if(!initialized){for(const k of ['on_temp','off_temp','disk_on','disk_off','min_on'])$(k).value=s.config[k];initialized=true}$('device').textContent=s.model+' · GPIO '+s.line+' · 版本 1.0.1';const box=$('events');box.replaceChildren();s.events.slice().reverse().slice(0,10).forEach(e=>{const p=document.createElement('p');p.textContent=new Date(e.time*1000).toLocaleTimeString('zh-CN')+'　'+(e.on?'开启':'关闭')+' · '+e.reason;box.append(p)});draw(s.history)}
async function refresh(){try{const r=await fetch(base+'/api/status',{cache:'no-store'}),v=await r.json();if(!r.ok||!v.ok)throw Error(v.error||'读取状态失败');csrf=v.csrf;render(v.data)}catch(e){$('connection').textContent='连接中断';$('message').textContent=e.message;$('fan').textContent='未知';$('reason').textContent='当前状态未确认，请检查应用服务';}}
async function save(data){if(busy)return;busy=true;document.querySelectorAll('button').forEach(b=>b.disabled=true);$('message').textContent='正在应用设置…';try{const r=await fetch(base+'/api/settings',{method:'POST',headers:{'Content-Type':'application/json','X-CSRF-Token':csrf},body:JSON.stringify(data)}),v=await r.json();if(!r.ok||!v.ok)throw Error(v.error||'保存失败');render(v.data);$('message').textContent='设置已生效'}catch(e){$('message').textContent=e.message}finally{busy=false;document.querySelectorAll('button').forEach(b=>b.disabled=false)}}
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>save({mode:b.dataset.mode}));$('settings').onsubmit=e=>{e.preventDefault();const data={};for(const k of ['on_temp','off_temp','disk_on','disk_off','min_on'])data[k]=Number($(k).value);save(data)};window.addEventListener('resize',()=>{if(lastState)draw(lastState.history)});refresh();setInterval(()=>{if(!busy)refresh()},3000);
</script>
</html>
